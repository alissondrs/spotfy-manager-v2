global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "app-metrics"
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000
          - identity:8101
          - fileimport:8102
          - playlist:8103
          - catalog:8104
          - bpm-match:8105
          - library:8106
          - report:8107